# /etc/pve/qemu-server/<VMID>.conf
# Tested on a Ryzen 9 6900HX (Radeon 680M) with Proxmox VE 8.4.
# Replace <VMID>, <BDF>, <AUDIO_BDF>, <ROM>, <MAC> and add efidisk0/tpmstate0
# (Windows 11) with the UI or qm set.
bios: ovmf
machine: pc-q35-9.2
cpu: host
sockets: 1
cores: 4
memory: 16384
balloon: 8192
ostype: win11
agent: 1
# Hide the hypervisor; no -no-reboot: the reset service needs in-place restarts.
args: -cpu 'host,-hypervisor,kvm=off'
# The Radeon is the primary display; the audio function follows it.
hostpci0: <BDF>,pcie=1,romfile=<ROM>,x-vga=1
hostpci1: <AUDIO_BDF>,pcie=1,romfile=AMDGopDriver.rom
# RadeonResetBugFix needs a virtual adapter to switch to (see docs/reset-bug.md).
vga: std
scsihw: virtio-scsi-single
net0: e1000=<MAC>,bridge=vmbr0,firewall=1
